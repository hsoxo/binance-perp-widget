name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build app bundle
        run: ./build.sh

      - name: Zip app bundle
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            "Binance Price Tracker.app" \
            "BinancePriceTracker-${GITHUB_REF_NAME}.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: BinancePriceTracker-*.zip
          generate_release_notes: true
          draft: false
          prerelease: false
          body: |
            ## Install

            1. Download `BinancePriceTracker-${{ github.ref_name }}.zip`
            2. Unzip and move **Binance Price Tracker.app** to `/Applications`
            3. First launch is ad-hoc signed — right-click the app and choose **Open**, or run:
               ```sh
               xattr -dr com.apple.quarantine "/Applications/Binance Price Tracker.app"
               ```

            ## Requirements
            macOS 13 (Ventura) or later.
